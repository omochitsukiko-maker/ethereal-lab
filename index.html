<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereal Consciousness Lab</title>
    <style>
        body{background-color:#0d0221;color:#f3e5f5;font-family:serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
        .outer-border{border:2px solid #d4af37;padding:10px;width:95%;max-width:600px;box-shadow:0 0 25px rgba(212,175,55,.3)}
        .container{border:1px solid #d4af37;padding:40px 30px;background-color:#0d0221;text-align:center}
        input,select,textarea{width:100%;background:#1a0a33;color:#fff;border:1px solid #d4af37;padding:12px;margin-bottom:15px;box-sizing:border-box;outline:none;font-size:1rem}
        .btn-main{width:100%;background:#a52a2a;color:#fff;border:none;padding:16px;cursor:pointer;font-weight:700;letter-spacing:4px;font-size:1.1rem}
        #r_disp{display:none}
    </style>
</head>
<body>
<div class="outer-border">
    <div class="container">
        <h1 style="color:#d4af37;letter-spacing:4px">ETHEREAL CONSCIOUSNESS LAB</h1>
        <p style="font-size:.85rem;margin:15px 0 30px;opacity:.8">魂の共鳴を読み取り、宿命の鎖を解き放つ。</p>
        
        <div id="f_init">
            <input type="text" id="v_n" placeholder="お名前">
            <div style="display:flex;gap:10px">
                <input type="date" id="v_b">
                <select id="v_t_b">
                    <option value="不明">血液型</option>
                    <option value="A">A型</option><option value="B">B型</option>
                    <option value="O">O型</option><option value="AB">AB型</option>
                </select>
            </div>
            <select id="v_u">
                <option value="金運">金運の鑑定</option>
                <option value="恋愛運">恋愛運の鑑定</option>
                <option value="健康運">健康運の鑑定</option>
            </select>
            <textarea id="v_d" placeholder="苦悩をありのままに..."></textarea>
            <button class="btn-main" onclick="_v_9()">運命を読み解く</button>
        </div>

        <div id="r_disp">
            <h2 style="color:#d4af37;letter-spacing:8px">鑑 定 啓 示</h2>
            <div id="v_out" style="text-align:left;line-height:1.8;margin:25px 0;white-space:pre-wrap"></div>
            <div style="border:1px dashed #d4af37;padding:20px;margin-top:30px">
                <p style="font-size:.9rem">魂と共鳴する唯一の守護石：</p>
                <span id="s_out" style="font-size:1.8rem;color:#d4af37;font-weight:700;display:block;margin:10px 0"></span>
                <button class="btn-main" onclick="alert('浄化の儀式へ移行します')">この石で宿命を書き換える</button>
            </div>
        </div>
    </div>
</div>

<script>
    async function _v_9() {
        const _n = document.getElementById('v_n').value || '迷える魂';
        const _d = document.getElementById('v_d').value;
        if(!_d) return alert("魂の声を入力してください");

        document.getElementById('f_init').style.display='none';
        document.getElementById('r_disp').style.display='block';
        const _o = document.getElementById('v_out');
        _o.innerText = `${_n}様の宿命周期を逆算中...`;

        try {
            const _r = await fetch('/api/v1_core_p9', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    _n: _n,
                    _t: document.getElementById('v_u').value,
                    _d: _d,
                    _b_d: document.getElementById('v_b').value,
                    _b_t: document.getElementById('v_t_b').value
                })
            });
            const _dx = await _r.json();
            setTimeout(() => {
                _o.innerText = _dx.a;
                document.getElementById('s_out').innerText = _dx.b;
            }, 3000);
        } catch(e) {
            _o.innerText = "Connection Error.";
        }
    }
</script>
</body>
</html>
