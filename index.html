<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Ethereal Consciousness Lab</title>
    <style>
        body { background-color: #0d0221; color: #f3e5f5; font-family: serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .outer-border { border: 2px solid #d4af37; padding: 15px; width: 90%; max-width: 700px; box-shadow: 0 0 25px rgba(212, 175, 55, 0.3); }
        .container { border: 1px solid #d4af37; padding: 40px; background-color: #0d0221; text-align: center; }
        h1 { color: #d4af37; font-size: 2.2rem; letter-spacing: 5px; margin: 0 0 10px 0; }
        .subtitle { font-size: 0.9rem; margin-bottom: 30px; }
        select, textarea { width: 100%; background: #1a0a33; color: #fff; border: 1px solid #d4af37; padding: 12px; box-sizing: border-box; margin-bottom: 20px; font-size: 1rem; outline: none; }
        .btn-main { background: #a52a2a; color: white; border: none; padding: 15px 50px; cursor: pointer; border-radius: 4px; font-size: 1.1rem; font-weight: bold; transition: 0.3s; }
        .btn-main:hover { background: #cd5c5c; }
        #result-area { display: none; }
        #kantei-text { text-align: left; line-height: 1.8; margin: 30px 0; white-space: pre-wrap; min-height: 100px; }
        .stone-box { border: 1px dashed #d4af37; padding: 20px; margin-top: 30px; }
        .stone-name { font-size: 1.8rem; color: #d4af37; font-weight: bold; display: block; margin: 10px 0; }
    </style>
</head>
<body>
<div class="outer-border">
    <div class="container">
        <h1>ETHEREAL CONSCIOUSNESS LAB</h1>
        <p class="subtitle">あなたの魂の歪みを検知し、救済の道を示します。</p>
        
        <div id="input-form">
            <select id="kantei-type">
                <option value="金運">金運を占う</option>
                <option value="恋愛運">恋愛運を占う</option>
                <option value="健康運">健康運を占う</option>
            </select>
            <textarea id="detail" placeholder="あなたの悩みをお書きください..."></textarea>
            <button class="btn-main" onclick="startKantei()">鑑定を開始する</button>
        </div>

        <div id="result-area">
            <h2 style="color:#d4af37;">鑑 定 結 果</h2>
            <hr style="border-color:#d4af37;">
            <div id="kantei-text"></div>
            <div class="stone-box">
                <p>あなたの魂を救済する守護石：</p>
                <span id="stone-display" class="stone-name"></span>
                <button class="btn-main">この石で魂を浄化する</button>
            </div>
            <p style="margin-top:20px; text-decoration:underline; cursor:pointer;" onclick="location.reload()">やり直す</p>
        </div>
    </div>
</div>

<script>
    const stones = {
        "金運": "極位タイガーアイ（金運）",
        "恋愛運": "最高位ローズクォーツ（愛）",
        "健康運": "特級アメジスト（癒）"
    };

    async function startKantei() {
        const type = document.getElementById('kantei-type').value;
        const detail = document.getElementById('detail').value;
        if (!detail) return alert("お悩みをご記入ください。");

        document.getElementById('input-form').style.display = "none";
        document.getElementById('result-area').style.display = "block";
        document.getElementById('kantei-text').innerText = "星の記憶を辿っています...";
        document.getElementById('stone-display').innerText = stones[type];

        try {
            const res = await fetch('/api/kantei', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, detail })
            });
            const data = await res.json();
            document.getElementById('kantei-text').innerText = data.result;
        } catch (e) {
            document.getElementById('kantei-text').innerText = "通信が遮断されました。再度お試しください。";
        }
    }
</script>
</body>
</html>
