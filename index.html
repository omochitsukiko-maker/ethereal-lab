<script>
    // 重要な処理を一つの関数にまとめ、変数名を意味不明なものにする（簡易難読化）
    async function startKantei() {
        const _0x1 = document.getElementById('kantei-type').value;
        const _0x2 = document.getElementById('detail').value;
        if (!_0x2) return;

        // UI操作
        document.getElementById('input-form').style.display = "none";
        document.getElementById('result-area').style.display = "block";
        const _out = document.getElementById('kantei-text');
        _out.innerText = "Accessing Ethereal Layer...";

        try {
            const _r = await fetch('/api/kantei', {
                method: 'POST',
                body: JSON.stringify({ type: _0x1, detail: _0x2 })
            });
            const _d = await _r.json();
            
            // サーバーから届いたデータのみを表示
            _out.innerText = _d.res;
            document.getElementById('stone-display').innerText = _d.stn;
        } catch {
            _out.innerText = "Connection lost.";
        }
    }
</script>
