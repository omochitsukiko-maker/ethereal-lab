<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereal Consciousness Lab</title>
    <style>
        body { background-color: #1a0633; color: #f3e5f5; font-family: "serif"; text-align: center; padding: 50px; }
        .container { border: 2px solid #d4af37; padding: 30px; max-width: 600px; margin: auto; background: rgba(0,0,0,0.5); }
        h1 { color: #d4af37; letter-spacing: 2px; }
        textarea { width: 90%; height: 100px; background: #2e1a47; color: white; border: 1px solid #d4af37; padding: 10px; margin: 20px 0; }
        select { background: #2e1a47; color: white; border: 1px solid #d4af37; padding: 10px; }
        button { background: #8b0000; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; cursor: pointer; border-radius: 5px; margin-top: 20px; }
        #result-area { display: none; margin-top: 30px; border-top: 1px solid #d4af37; padding-top: 20px; text-align: left; line-height: 1.8; }
        .stone-name { font-size: 1.5rem; color: #d4af37; font-weight: bold; text-align: center; display: block; margin-top: 10px; }
        #kantei-text { white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h1>Ethereal Consciousness Lab</h1>
    <p>あなたの魂の歪みを検知し、救済の道を示します。</p>

    <div id="input-form">
        <select id="type">
            <option value="money">金運上昇</option>
            <option value="love">恋愛成就</option>
            <option value="purify">邪気浄化</option>
        </select><br>
        <textarea id="detail" placeholder="あなたの悩みや現在の状況を詳しくお書きください..."></textarea><br>
        <button onclick="startKantei()">鑑定を開始する</button>
    </div>

    <div id="result-area">
        <h2 style="text-align: center; color: #d4af37;">鑑定結果</h2>
        <div id="kantei-text"></div>
        <div id="stone-info" style="margin-top: 30px; text-align: center;">
            あなたの魂を救済する守護石：<br>
            <span id="stone-name" class="stone-name"></span>
            <button onclick="alert('購入ページへ移行します')" style="background: #b22222; margin-top: 20px;">この石で魂を浄化する（購入ページへ）</button>
        </div>
    </div>
</div>

<script>
    async function startKantei() {
        const type = document.getElementById('type').value;
        const detail = document.getElementById('detail').value;
        const kanteiTextDiv = document.getElementById('kantei-text');
        const resultArea = document.getElementById('result-area');
        const stoneNameSpan = document.getElementById('stone-name');

        if (!detail) {
            alert("悩みを入力してください。");
            return;
        }

        // 表示の切り替え
        kanteiTextDiv.innerText = "宇宙の意思を確認中...";
        resultArea.style.display = "block";
        document.getElementById('input-form').style.display = "none";

        try {
            const response = await fetch('/api/kantei', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, detail })
            });

            const data = await response.json();

            // data.result が存在するか確認し、存在すれば表示
            if (data && data.result) {
                kanteiTextDiv.innerText = data.result;
            } else {
                // キーが不一致または中身が空の場合の予備表示
                kanteiTextDiv.innerText = "鑑定結果の取得に失敗しました。レスポンス形式が不正です。";
                console.error("Unexpected response format:", data);
            }

            // 石の判定ロジック
            let stone = "";
            if (type === 'money') stone = "極位タイガーアイ（金運）";
            else if (type === 'love') stone = "至高のローズクォーツ（愛）";
            else stone = "深淵のアメジスト（浄化）";
            stoneNameSpan.innerText = stone;

        } catch (error) {
            kanteiTextDiv.innerText = "通信中に断絶が発生しました。再度お試しください。";
            console.error("Fetch error:", error);
        }
    }
</script>

</body>
</html>
