<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereal Consciousness Lab</title>
    <style>
        body {
            background-color: #0d0221;
            color: #f3e5f5;
            font-family: "Georgia", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .outer-border {
            border: 2px solid #d4af37;
            padding: 10px;
            width: 90%;
            max-width: 800px;
        }
        .container {
            border: 1px solid #d4af37;
            padding: 40px;
            background-color: #0d0221;
            text-align: center;
        }
        h1 {
            color: #d4af37;
            font-size: 2.5rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        hr {
            border: 0;
            border-top: 1px solid #d4af37;
            margin: 30px 0;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }
        h2 {
            color: #d4af37;
            font-size: 1.8rem;
            margin-bottom: 30px;
        }
        #input-form {
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            background: #1a0a33;
            color: #fff;
            border: 1px solid #d4af37;
            padding: 15px;
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 20px;
            resize: none;
        }
        select {
            background: #1a0a33;
            color: #fff;
            border: 1px solid #d4af37;
            padding: 10px 20px;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        .btn-main {
            background: #a52a2a;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn-main:hover {
            background: #8b0000;
        }
        #result-area {
            display: none;
            text-align: left;
        }
        #kantei-text {
            line-height: 2;
            margin-bottom: 40px;
            white-space: pre-wrap;
        }
        .stone-box {
            text-align: center;
            margin-top: 20px;
        }
        .stone-name {
            font-size: 1.8rem;
            color: #d4af37;
            font-weight: bold;
            display: block;
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="outer-border">
    <div class="container">
        <h1>Ethereal Consciousness Lab</h1>
        <p class="subtitle">あなたの魂の歪みを検知し、救済の道を示します。</p>

        <div id="input-form">
            <select id="type">
                <option value="money">金運上昇</option>
                <option value="love">恋愛成就</option>
                <option value="purify">邪気浄化</option>
            </select><br>
            <textarea id="detail" placeholder="あなたの悩みや現在の状況を詳しくお書きください..."></textarea><br>
            <button class="btn-main" onclick="startKantei()">鑑定を開始する</button>
        </div>

        <div id="result-area">
            <hr>
            <h2>鑑定結果</h2>
            <div id="kantei-text"></div>
            <div class="stone-box">
                <p>あなたの魂を救済する守護石：</p>
                <span id="stone-name" class="stone-name"></span>
                <button class="btn-main" onclick="alert('購入ページへ移行します')">この石で魂を浄化する（購入ページへ）</button>
            </div>
        </div>
    </div>
</div>

<script>
    async function startKantei() {
        const type = document.getElementById('type').value;
        const detail = document.getElementById('detail').value;
        const kanteiTextDiv = document.getElementById('kantei-text');
        const resultArea = document.getElementById('result-area');
        const inputForm = document.getElementById('input-form');
        const stoneNameSpan = document.getElementById('stone-name');

        if (!detail) {
            alert("悩みを入力してください。");
            return;
        }

        inputForm.style.display = "none";
        resultArea.style.display = "block";
        kanteiTextDiv.innerText = "深層意識へアクセス中...";

        try {
            const response = await fetch('/api/kantei', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, detail })
            });

            const data = await response.json();

            // APIからのレスポンスをそのまま入れる（ここを「失敗」と固定しない）
            kanteiTextDiv.innerText = data.result || "応答が空でした。";

            let stone = "";
            if (type === 'money') stone = "極位タイガーアイ（金運）";
            else if (type === 'love') stone = "至高のローズクォーツ（愛）";
            else stone = "深淵のアメジスト（浄化）";
            stoneNameSpan.innerText = stone;

        } catch (error) {
            kanteiTextDiv.innerText = "ネットワーク接続に問題があります。";
        }
    }
</script>

</body>
</html>
