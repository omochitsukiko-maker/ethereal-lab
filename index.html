<script>
    async function _v_9() {
        const _n = document.getElementById('v_n').value || '迷える魂';
        const _b_d = document.getElementById('v_b').value;
        const _b_t = document.getElementById('v_t_b').value;
        const _u = document.getElementById('v_u').value;
        const _d = document.getElementById('v_d').value;

        // 必須チェック（悩み相談が空だとAIがエラーになるのを防ぐ）
        if(!_d || _d.length < 5) {
            alert('魂の声（お悩み）をお聞かせください。');
            return;
        }

        // UI切り替え
        document.getElementById('f_init').style.display = 'none';
        document.getElementById('r_disp').style.display = 'block';
        const _o = document.getElementById('v_out');
        _o.innerText = `${_n}様の宿命周期を解析中...`;

        try {
            // 修正：送信データのキー名をAPI側と一致させる
            const _r = await fetch('/api/v1_core_p9', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    _n: _n, 
                    _t: _u, 
                    _d: _d, 
                    _b_d: _b_d, 
                    _b_t: _b_t 
                })
            });

            if (!_r.ok) throw new Error("Network Response Error");

            const _dx = await _r.json();

            // 演出時間（4秒）を設けてから表示
            setTimeout(() => {
                _o.innerText = _dx.a;
                document.getElementById('s_out').innerText = _dx.b || "守護石";
            }, 4000);

        } catch (err) {
            _o.innerText = "聖域の波動が乱れ、通信が遮断されました。もう一度お試しください。";
            console.error(err);
        }
    }
</script>
